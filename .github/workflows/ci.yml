name: build-and-validate
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build dependencies
        run: python -m pip install pybind11==2.13.6 build
      - name: Configure
        shell: pwsh
        run: |
          $pybind = python -m pybind11 --cmakedir
          $interpreter = python -c "import sys; print(sys.executable)"
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DXWORD_BUILD_PYTHON=ON "-Dpybind11_DIR=$pybind" "-DPython_EXECUTABLE=$interpreter"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Open XML schema validation
        shell: pwsh
        run: |
          $documents = @('v2_features.docx','v2_cpp_parity.docx','v2_python_features.docx','v2_images.docx','v2_template_out.docx','v2_headers.docx','v2_empty.docx') | ForEach-Object { "build/ci/$_" }
          dotnet run --project tools/OpenXmlValidator -- @documents
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build wheel
        run: python -m build --wheel --outdir build/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: xword-${{ matrix.os }}
          path: |
            build/ci/v2_*.docx
            build/wheels/*.whl
