[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xword-docx"
version = "1.0.0"
description = ".docx (Office Open XML) document generator with pybind11 native C++ backend"
authors = [{name = "XWord contributors"}]
license = {text = "MIT"}
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
xword = ["_native*.pyd", "_native*.so"]
