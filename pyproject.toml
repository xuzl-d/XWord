[build-system]
requires = ["scikit-build-core==0.10.7", "pybind11==2.13.6"]
build-backend = "scikit_build_core.build"

[project]
name = "xword-docx"
version = "2.0.0"
description = "C++17 / Python Office Open XML document generator"
readme = "README.md"
authors = [{name = "XWord contributors"}]
license = {text = "MIT"}
requires-python = ">=3.8"

[tool.scikit-build]
cmake.args = ["-DXWORD_BUILD_PYTHON=ON", "-DXWORD_BUILD_TESTS=OFF", "-DXWORD_BUILD_EXAMPLES=OFF"]
wheel.packages = ["python/xword"]
install.components = ["python"]
sdist.exclude = ["build", "dist", "python/xword/*.pyd", "python/xword/*.so"]
